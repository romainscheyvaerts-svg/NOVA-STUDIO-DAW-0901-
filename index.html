
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c0d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Nova Studio — Enregistre ta voix | Make Music</title>
  <meta name="description" content="Enregistre ta voix sur les beats du studio Make Music, depuis ton téléphone ou ton PC : prompteur de paroles, mix auto, ingé son virtuel. Gratuit.">
  <!-- Application installable (écran d'accueil du téléphone) -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="Nova Studio">
  <script>
    // Thème mémorisé (utils/themeStore.ts) posé avant tout affichage : pas
    // d'éclair sombre au démarrage quand on a choisi le thème clair.
    (function () {
      var t = 'dark';
      try {
        var p = localStorage.getItem('nova_theme');
        if (p === 'light' || (p === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches)) t = 'light';
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Polices embarquees : le DAW tourne aussi dans l'application iPhone,
       ou dependre du reseau pour la typographie n'a pas de sens.
       Inter et JetBrains Mono sont variables : un fichier chacune. -->
  <style>
    /* Nova « montre » un réglage : halo pulsé + bulle d'explication */
    .nova-spotlight { position: relative; z-index: 60; outline: 3px solid #22d3ee !important; outline-offset: 3px; border-radius: 10px; animation: nova-spot 1s ease-in-out infinite; }
    @keyframes nova-spot { 0%,100% { box-shadow: 0 0 0 0 rgba(34,211,238,.65); } 50% { box-shadow: 0 0 0 10px rgba(34,211,238,0); } }
    .nova-spot-bubble { position: fixed; z-index: 9000; max-width: 260px; background: #22d3ee; color: #021014; font: 600 12px/1.35 Inter, system-ui, sans-serif; padding: 8px 11px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.5); pointer-events: none; }
    @media (prefers-reduced-motion: reduce) { .nova-spotlight { animation: none; } }
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 300 800;
      font-display: swap;
      src: url('%BASE_URL%fonts/inter-latin.woff2') format('woff2');
    }
    @font-face {
      font-family: 'JetBrains Mono';
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url('%BASE_URL%fonts/jetbrains-mono-latin.woff2') format('woff2');
    }
  </style>
  <style>
    /* =================================================================
       THÈME — direction « Épure orbitale » (07/10/2026)
       Les couleurs (sombre ET clair) sont des variables CSS générées par
       styles/novaTheme.js (configuration Tailwind) : --bg-main, --bg-surface,
       --text-primary, --accent-neon… et toute la palette Tailwind.
       Ici : seulement les tailles et le strict minimum pour l'écran de
       chargement, affiché avant que la feuille de style n'arrive.
       ================================================================= */
    :root {
      --bg-main: #0c0d10;
      --safe-area-bottom: env(safe-area-inset-bottom);
      /* Standard Desktop Sizes */
      --btn-height: 2.5rem; /* 40px */
      --track-header-width: 17rem; /* 272px (Desktop default) */
      --fader-width: 2.5rem;
      /* Mouvement : 150 à 200 ms, courbe douce */
      --nv-ease: cubic-bezier(.2, .7, .2, 1);
      --nv-dur: 160ms;
    }
    [data-theme="light"] { --bg-main: #f1f4f8; }

    /* Fond de la zone de travail : plus de grille décorative ni de halo,
       la timeline a déjà sa propre grille (épurer, pas charger). */
    .nova-grille { position: relative; }

    /* Barre du haut : surface pleine, sans flou (le flou d'arrière-plan
       coûtait à chaque image pendant la lecture). */
    .nova-verre { background: var(--bg-surface); border-color: var(--border-dim); }
    .nova-verre-haut { position: relative; }

    /* Lueur : UNIQUEMENT sur ce qui est actif (lecture, sélection, REC) */
    .nova-halo {
      box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.35), 0 0 16px -4px rgba(34, 211, 238, 0.55);
    }
    .nova-halo-rouge {
      box-shadow: 0 0 0 1px rgba(239, 68, 68, 0.45), 0 0 18px -4px rgba(239, 68, 68, 0.6);
    }
    [data-theme="light"] .nova-halo { box-shadow: 0 0 0 1px rgba(8, 145, 178, 0.35), 0 4px 14px -4px rgba(8, 145, 178, 0.45); }
    [data-theme="light"] .nova-halo-rouge { box-shadow: 0 0 0 1px rgba(220, 38, 38, 0.4), 0 4px 14px -4px rgba(220, 38, 38, 0.45); }

    /* Chiffres techniques (timecode, tempo) : police mono à chasse fixe */
    .nova-chiffres {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
    }

    /* Respiration lente d'un temoin d'enregistrement */
    @keyframes nova-pouls {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.6; }
    }
    .nova-pouls { animation: nova-pouls 2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .nova-pouls { animation: none; } }

    /* Zone qui reste sombre en thème clair (fenêtres d'effets dessinées comme
       du matériel) : ses variables sont remises au sombre par novaTheme.js. */
    [data-theme="light"] .nova-sombre { color: var(--text-primary); }

    body { background-color: var(--bg-main); color: var(--text-primary); transition: background-color var(--nv-dur) ease, color var(--nv-dur) ease; }

    /* --- MODE TABLETTE OPTIMISÉ --- */
    body[data-view-mode="TABLET"] {
      --btn-height: 3.5rem; /* 56px pour le tactile */
      --track-header-width: 19rem; /* 304px - Plus large pour les doigts */
      --fader-width: 3.5rem; /* Faders plus larges */
      font-size: 115%; /* Texte plus lisible */
    }
    
    /* Cacher le texte des boutons secondaires sur tablette pour clarté */
    body[data-view-mode="TABLET"] .hide-on-tablet-text span { display: none; }
    
    /* Boutons plus gros sur tablette */
    body[data-view-mode="TABLET"] button { min-height: 44px; min-width: 44px; }
    
    /* Scrollbars invisibles sur tactile */
    body[data-view-mode="TABLET"] ::-webkit-scrollbar { width: 0px; background: transparent; }

    /* --- MODE MOBILE --- */
    body[data-view-mode="MOBILE"] {
      --btn-height: 3rem;
      --track-header-width: 100%; 
    }
    body[data-view-mode="MOBILE"] ::-webkit-scrollbar { width: 0px; background: transparent; }

    html, body {
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    #root {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Plancher de lisibilité : les étiquettes de 6-7 px passent à 8 px. */
    html .text-\[6px\], html .text-\[7px\] { font-size: 8px; }

    .mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

    /* Finitions : texte plus net sur fond sombre, sélection aux couleurs de
       Nova, et un anneau de focus visible au clavier seulement (la souris et
       le doigt n'en affichent pas). */
    body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
    ::selection { background: rgba(34, 211, 238, 0.28); color: var(--text-primary); }
    :where(button, a, [role="button"], [role="tab"], [role="slider"], input, select, textarea):focus-visible {
      outline: 2px solid rgba(34, 211, 238, 0.85);
      outline-offset: 2px;
    }

    /* Scrollbar Desktop */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-main); }
    ::-webkit-scrollbar-thumb { background: var(--border-highlight); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-neon); }

    .fx-slot { transition: all 0.1s ease; cursor: grab; }
    .delete-fx {
      position: absolute; top: -6px; right: -6px; width: 18px; height: 18px;
      background: #ef4444; color: white; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; opacity: 0; transition: all 0.2s ease; z-index: 50;
      cursor: pointer;
    }
    .fx-slot:hover .delete-fx { opacity: 1; }
    /* Un seul marche / arrêt par fenêtre d'effet : celui de la barre (audit G17). */
    .nova-hosted-plugin [data-plugin-power] { display: none !important; }

    /* Zones de sécurité iPhone (encoche, barre d'accueil) : ces classes étaient
       utilisées par les composants mobiles mais définies nulle part. */
    .safe-area-inset { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
    .safe-area-inset-bottom { padding-bottom: env(safe-area-inset-bottom); }
    .safe-area-inset-left { padding-left: env(safe-area-inset-left); }
    .safe-area-inset-right { padding-right: env(safe-area-inset-right); }
    .safe-area-top { padding-top: env(safe-area-inset-top); }

    /* Écrans tactiles : pas de survol, cibles plus grandes, pas de zoom iOS au
       focus d'un champ (déclenché sous 16 px). */
    @media (hover: none) { .delete-fx { opacity: 1; } }
    @media (pointer: coarse) {
      input:not([type="range"]):not([type="checkbox"]):not([type="radio"]), textarea, select { font-size: 16px !important; }
    }

    input[type="range"] { appearance: none; background: var(--border-highlight); border-radius: 10px; height: 4px; }
    input[type="range"]::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; background: var(--accent-neon); border-radius: 50%; cursor: pointer; transition: transform 0.1s; }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

    /* Tactile : ces règles venaient AVANT celles du dessus et étaient donc
       écrasées (curseur de 12 px, piste de 4 px). Placées après : curseur de
       24 px et zone de saisie de 40 px dont seul le trait central (6 px) se voit.
       Les glissières à hauteur fixée en ligne (style="height…") gardent la leur. */
    @media (pointer: coarse) {
      input[type="range"]:not([style*="height"]) { height: 40px; padding: 17px 0; background-clip: content-box !important; }
      input[type="range"]::-webkit-slider-thumb { width: 24px; height: 24px; }
      input[type="range"]::-moz-range-thumb { width: 24px; height: 24px; }
    }

    /* Gros sliders pour Tablette/Mobile */
    body[data-view-mode="TABLET"] input[type="range"]::-webkit-slider-thumb,
    body[data-view-mode="MOBILE"] input[type="range"]::-webkit-slider-thumb {
        width: 24px; height: 24px; box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    
    .touch-manipulation { touch-action: manipulation; }
    .touch-none { touch-action: none; }

    /* Cible tactile d'au moins 40 x 40 px sans grossir le visuel : une zone
       invisible déborde autour des petits boutons (pistes, barres d'outils). */
    .nova-hit:not(.absolute):not(.fixed):not(.sticky) { position: relative; }
    .nova-hit::after {
      content: ''; position: absolute;
      top: min(0px, calc((100% - 40px) / 2)); bottom: min(0px, calc((100% - 40px) / 2));
      left: min(0px, calc((100% - 40px) / 2)); right: min(0px, calc((100% - 40px) / 2));
    }
    /* Même zone, mais seulement au doigt : à la souris (vues PC) rien ne change. */
    @media (pointer: coarse) {
      .nova-hit-tactile:not(.absolute):not(.fixed):not(.sticky) { position: relative; }
      .nova-hit-tactile::after {
        content: ''; position: absolute;
        top: min(0px, calc((100% - 40px) / 2)); bottom: min(0px, calc((100% - 40px) / 2));
        left: min(0px, calc((100% - 40px) / 2)); right: min(0px, calc((100% - 40px) / 2));
      }
    }
    /* Rangée de petits boutons : 4 px d'écart, 12 px au doigt pour que chaque
       zone de 40 px ne déborde pas sur la voisine (le mode tablette agrandit
       déjà les boutons à 44 px, l'écart y reste de 4 px). */
    .nova-hit-gap { column-gap: 4px; }
    @media (pointer: coarse) {
      body:not([data-view-mode="TABLET"]) .nova-hit-gap { column-gap: 12px; }
    }
    /* Défilement horizontal sans barre visible (barres d'actions mobiles). */
    .scrollbar-hide { scrollbar-width: none; -ms-overflow-style: none; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }

    .automation-lane-container {
        width: 100%;
        height: 80px;
        background-color: var(--bg-surface);
        transition: height 0.3s ease;
        border-bottom: 1px solid var(--border-dim);
        overflow: hidden;
        position: relative;
    }
  </style>
  <!-- Import map removed - Vite bundles all dependencies -->

  <!-- ====================================================================
       Mode embarque

       Le DAW est aussi une page de l'application Make Music. Dans ce cas
       il ne doit pas se presenter comme un produit separe : on masque sa
       marque « Nova Studio » et son bouton de connexion, l'utilisateur
       etant deja connecte au studio. Le detachement se fait sur ?embed=1,
       ou simplement sur le fait d'etre dans un cadre.

       Aucun effet sur le DAW ouvert seul dans un navigateur.
       ==================================================================== -->
  <style>
    html[data-embed] .nova-brandbar,
    html[data-embed] .nova-signature { display: none !important; }
  </style>
  <script>
    (function () {
      try {
        var embarque = new URLSearchParams(location.search).has('embed')
                    || window.self !== window.top;
        if (embarque) document.documentElement.setAttribute('data-embed', '1');
      } catch (e) {
        // Acces au parent refuse = on est bien dans un cadre
        document.documentElement.setAttribute('data-embed', '1');
      }
    })();
  </script>
</head>
<body>
  <!-- Loading screen visible until React mounts -->
  <div id="loading-screen" style="position:fixed;inset:0;background:var(--bg-main,#0c0d10);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;transition:opacity 0.3s ease;">
    <div style="width:48px;height:48px;border:3px solid rgba(0,242,255,0.2);border-top-color:#00f2ff;border-radius:50%;animation:spin 1s linear infinite;"></div>
    <p style="margin-top:16px;color:#64748b;font-family:Inter,sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;">Nova Studio</p>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  </div>
  <div id="root"></div>
  <script>
    // Global error handler to show errors instead of black screen
    function showError(msg, details) {
      var loadingEl = document.getElementById('loading-screen');
      if (loadingEl) {
        loadingEl.innerHTML = '<div style="max-width:600px;padding:20px;text-align:center;">' +
          '<h1 style="color:#ef4444;font-size:24px;margin-bottom:16px;">Erreur de chargement</h1>' +
          '<p style="color:#94a3b8;margin-bottom:16px;">' + msg + '</p>' +
          (details ? '<p style="color:#64748b;font-size:12px;">' + details + '</p>' : '') +
          '<button onclick="location.reload()" style="margin-top:20px;padding:12px 24px;background:#00f2ff;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer;">Recharger</button>' +
          '</div>';
      }
    }
    window.onerror = function(msg, url, line) {
      showError(msg, 'Ligne ' + line + ' dans ' + (url || 'unknown'));
      return false;
    };
    window.onunhandledrejection = function(e) {
      showError(e.reason?.message || 'Erreur async', e.reason?.stack?.split('\\n')[0] || '');
    };
    // Cache busting: Force reload si nouvelle version détectée
    (function() {
      const BUILD_VERSION = '__BUILD_VERSION__'; // Remplacé par Vite au build
      const STORED_VERSION = localStorage.getItem('nova_build_version');

      // Si nouvelle version, vider le cache et recharger
      if (STORED_VERSION && STORED_VERSION !== BUILD_VERSION) {
        console.log('[NOVA] Nouvelle version détectée, nettoyage du cache...');
        localStorage.setItem('nova_build_version', BUILD_VERSION);
        location.reload(true);
      } else if (!STORED_VERSION) {
        localStorage.setItem('nova_build_version', BUILD_VERSION);
      }
    })();

    // Démarrage bloqué (réseau coupé, ancienne version gardée par le
    // navigateur…) : au lieu d'un écran sombre sans fin, on propose de
    // recharger ou de réparer (vide la copie hors ligne et recharge).
    window.novaRepair = function() {
      var done = function() { location.replace(location.pathname + '?r=' + Date.now() + (location.search ? '&' + location.search.slice(1) : '')); };
      var jobs = [];
      try { if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs) { return Promise.all(rs.map(function(r) { return r.unregister(); })); })); } catch (e) {}
      try { if (window.caches) jobs.push(caches.keys().then(function(ks) { return Promise.all(ks.map(function(k) { return caches.delete(k); })); })); } catch (e) {}
      Promise.all(jobs).then(done, done);
    };
    setTimeout(function() {
      var root = document.getElementById('root');
      var loadingEl = document.getElementById('loading-screen');
      if (loadingEl && root && !root.children.length) {
        loadingEl.innerHTML = '<div style="max-width:420px;padding:24px;text-align:center;font-family:Inter,sans-serif;">' +
          '<p style="color:#e2e8f0;font-size:18px;font-weight:700;margin-bottom:8px;">Nova met du temps à démarrer</p>' +
          '<p style="color:#94a3b8;font-size:14px;margin-bottom:20px;">Vérifie ta connexion. Si l\'écran reste vide, « Réparer » efface l\'ancienne version gardée par ton navigateur (tes sessions ne sont pas supprimées).</p>' +
          '<button onclick="location.reload()" style="margin:4px;padding:12px 20px;background:#00f2ff;color:#000;border:none;border-radius:10px;font-weight:800;cursor:pointer;">Recharger</button>' +
          '<button onclick="novaRepair()" style="margin:4px;padding:12px 20px;background:transparent;color:#e2e8f0;border:1px solid #475569;border-radius:10px;font-weight:700;cursor:pointer;">Réparer</button>' +
          '</div>';
      }
    }, 12000);

    // SPA redirect handler for GitHub Pages
    (function(){
      var redirect = sessionStorage.redirect;
      delete sessionStorage.redirect;
      if (redirect && redirect !== location.href) {
        history.replaceState(null, null, redirect);
      }
    })();
  </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
